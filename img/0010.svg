<svg width="200" height="220" 
    xmlns="http://www.w3.org/2000/svg" style="background: transparent;">
    <style>
    .line-red {
      stroke: red;
      stroke-width: 2;
      fill: none;
    }
    .line-blue {
      stroke: blue;
      stroke-width: 2;
      fill: none;
    }
    .font-red {
      font-family: sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: red;
    }
    .fill-red {
      fill: red;
    }
    .fill-blue {
      fill: blue;
    }
  </style>
    <polygon class="line-red" points="100,20 180,120 130,200 50,200 20,140"/>
    <circle class="fill-red" cx="100" cy="20" r="3"/>
    <text class="font-red" x="100" y="15" text-anchor="middle">A</text>
    <circle class="fill-red" cx="180" cy="120" r="3"/>
    <text class="font-red" x="190" y="115" text-anchor="middle">B</text>
    <circle class="fill-red" cx="130" cy="200" r="3"/>
    <text class="font-red" x="140" y="205" text-anchor="middle">C</text>
    <circle class="fill-red" cx="50" cy="200" r="3"/>
    <text class="font-red" x="40" y="205" text-anchor="middle">D</text>
    <circle class="fill-red" cx="20" cy="140" r="3"/>
    <text class="font-red" x="15" y="135" text-anchor="middle">E</text>

    <line class="line-blue" x1="20" y1="140" x2="180" y2="120"/> # EB
    <line class="line-blue" x1="20" y1="140" x2="130" y2="200"/> # EC

    <circle class="fill-blue" cx="100" cy="130" r="3"/>
    <text class="font-red" x="105" y="125" text-anchor="middle">F</text>
    <line class="line-blue" x1="100" y1="20" x2="100" y2="130"/> # AF

    <circle class="fill-blue" cx="75" cy="170" r="3"/>
    <text class="font-red" x="85" y="165" text-anchor="middle">G</text>
    <line class="line-blue" x1="50" y1="200" x2="75" y2="170"/> # DG

</svg>



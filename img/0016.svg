<svg width="170" height="120" 
    xmlns="http://www.w3.org/2000/svg" style="background: transparent;">
    <style>
    .line-red {
      stroke: red;
      stroke-width: 2;
      fill: none;
    }
    .line-blue {
      stroke: blue;
      stroke-width: 2;
      fill: none;
    }
    .line-green {
      stroke: green;
      stroke-width: 2;
      fill: none;
    }
    .font-red {
      font-family: sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: red;
    }
    .font-blue {
      font-family: sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: blue;
    }
    .font-green {
      font-family: sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: green;
    }
    .fill-red {
      fill: red;
    }
    .fill-blue {
      fill: blue;
    }
    .fill-green {
      fill: green;
    }
  </style>

    # hk
    <polyline class="line-blue" points="150,10 10,110 150,110"/> 
    <text class="font-blue" x="160" y="10" text-anchor="middle">k</text>
    <text class="font-blue" x="160" y="110" text-anchor="middle">h</text>

    <circle class="fill-green" cx="125" cy="80" r="3"/>
    <text class="font-green" x="135" y="80" text-anchor="middle">A</text>
    <circle class="fill-green" cx="110" cy="60" r="3"/>
    <text class="font-green" x="120" y="60" text-anchor="middle">B</text>

    <circle class="fill-red" cx="90" cy="30" r="3"/>
    <text class="font-red" x="80" y="20" text-anchor="middle">C</text>
    <circle class="fill-red" cx="70" cy="55" r="3"/>
    <text class="font-red" x="65" y="50" text-anchor="middle">D</text>

    <circle class="fill-blue" cx="130" cy="110" r="3"/>
    <text class="font-blue" x="135" y="100" text-anchor="middle">F</text>
    <circle class="fill-blue" cx="130" cy="25" r="3"/>
    <text class="font-blue" x="135" y="40" text-anchor="middle">G</text>
</svg>



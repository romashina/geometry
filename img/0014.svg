<svg width="220" height="120" 
    xmlns="http://www.w3.org/2000/svg" style="background: transparent;">
    <style>
    .line-red {
      stroke: red;
      stroke-width: 2;
      fill: none;
    }
    .line-blue {
      stroke: blue;
      stroke-width: 2;
      fill: none;
    }
    .line-green {
      stroke: green;
      stroke-width: 2;
      fill: none;
    }
    .font-red {
      font-family: sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: red;
    }
    .font-blue {
      font-family: sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: blue;
    }
    .font-green {
      font-family: sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: green;
    }
    .fill-red {
      fill: red;
    }
    .fill-blue {
      fill: blue;
    }
    .fill-green {
      fill: green;
    }
    .fill-white {
      fill: white;
    }
  </style>
    # AOB
    <line class="line-red" x1="10" y1="60" x2="200" y2="20"/>
    <text class="font-red" x="210" y="30">h</text>
    <line class="line-green" x1="10" y1="60" x2="200" y2="60"/>
    <text class="font-green" x="210" y="60">k</text>
    <line class="line-blue" x1="10" y1="60" x2="200" y2="100"/> 
    <text class="font-blue" x="210" y="100">l</text>
    <circle class="fill-white" cx="10" cy="60" r="5" />
</svg>



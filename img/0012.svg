<svg width="400" height="120" 
    xmlns="http://www.w3.org/2000/svg" style="background: transparent;">
    <style>
    .line-red {
      stroke: red;
      stroke-width: 2;
      fill: none;
    }
    .line-blue {
      stroke: blue;
      stroke-width: 2;
      fill: none;
    }
    .line-green {
      stroke: green;
      stroke-width: 2;
      fill: none;
    }
    .font-red {
      font-family: sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: red;
    }
    .font-blue {
      font-family: sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: blue;
    }
    .font-green {
      font-family: sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: green;
    }
    .fill-red {
      fill: red;
    }
    .fill-blue {
      fill: blue;
    }
    .fill-green {
      fill: green;
    }
  </style>
    # AOB
    <polyline class="line-red" points="100,10 10,110 110,110"/> 
    <circle class="fill-red" cx="10" cy="110" r="3"/>
    <text class="font-red" x="10" y="100" text-anchor="middle">O</text>
    <circle class="fill-red" cx="110" cy="110" r="3"/>
    <text class="font-red" x="100" y="100" text-anchor="middle">A</text>
    <circle class="fill-red" cx="100" cy="10" r="3"/>
    <text class="font-red" x="100" y="30" text-anchor="middle">B</text>
    # hk
    <polyline class="line-blue" points="250,10 150,110 250,110"/> 
    <text class="font-blue" x="200" y="50" text-anchor="middle">k</text>
    <text class="font-blue" x="200" y="100" text-anchor="middle">h</text>
    # M
    <polyline class="line-green" points="400,10 300,110 400,110"/> 
    <circle class="fill-green" cx="300" cy="110" r="3"/>
    <text class="font-green" x="290" y="105" text-anchor="middle">M</text>
</svg>



<svg width="430" height="150" 
    xmlns="http://www.w3.org/2000/svg" style="background: transparent;">
    <style>
    .shape {
      stroke: #d62728;
      stroke-width: 2;
      fill: rgba(214,39,40,0.08);
    }
    .open {
      fill: none;
      stroke: #1f77b4;
      stroke-width: 2;
    }
    .point {
      fill: #d62728;
      stroke: #d62728;
    }
    .point-blue {
      fill: #1f77b4;
      stroke: #1f77b4;
    }
    .label {
      font-family: sans-serif;
      font-weight: 600;
      font-size: 16px;
      fill: #333;
    }
    .label-red {
      fill: #d62728;
    }
    .label-blue {
      fill: #1f77b4;
    }
  </style>
    <text class="label" x="35" y="25">а</text>
    <polygon class="shape" points="80,110 150,50 220,110" />
    <circle class="point" cx="80" cy="110" r="4" />
    <circle class="point" cx="150" cy="50" r="4" />
    <circle class="point" cx="220" cy="110" r="4" />
    <text class="label label-red" x="75" y="135">A</text>
    <text class="label label-red" x="159" y="42">B</text>
    <text class="label label-red" x="220" y="135">C</text>
    <text class="label" x="255" y="25">б</text>
    <polyline class="open" points="260,110 310,50 360,110 410,140" />
    <circle class="point-blue" cx="260" cy="110" r="4" />
    <circle class="point-blue" cx="310" cy="50" r="4" />
    <circle class="point-blue" cx="360" cy="110" r="4" />
    <circle class="point-blue" cx="410" cy="140" r="4" />
    <text class="label label-blue" x="255" y="135">A</text>
    <text class="label label-blue" x="320" y="42">B</text>
    <text class="label label-blue" x="370" y="110">C</text>
    <text class="label label-blue" x="418" y="140">D</text>
</svg>

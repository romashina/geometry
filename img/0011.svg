<svg width="200" height="140" 
    xmlns="http://www.w3.org/2000/svg" style="background: transparent;">
    <style>
    .line-red {
      stroke: red;
      stroke-width: 2;
      fill: none;
    }
    .line-blue {
      stroke: blue;
      stroke-width: 2;
      fill: none;
    }
    .font-red {
      font-family: sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: red;
    }
    .fill-red {
      fill: red;
    }
    .fill-blue {
      fill: blue;
    }
  </style>
    <circle class="fill-blue" cx="180" cy="140" r="3"/>
    <text class="font-red" x="190" y="135" text-anchor="middle">B</text>

    <circle class="fill-blue" cx="20" cy="140" r="3"/>
    <text class="font-red" x="15" y="135" text-anchor="middle">A</text>

    <line class="line-blue" x1="20" y1="140" x2="180" y2="140"/> # AB


    <circle class="fill-blue" cx="100" cy="140" r="3"/>
    <text class="font-red" x="90" y="135" text-anchor="middle">C</text>
    <line class="line-red" x1="100" y1="140" x2="190" y2="50"/> # C

</svg>



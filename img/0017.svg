<svg width="170" height="120" 
    xmlns="http://www.w3.org/2000/svg" style="background: transparent;">
    <style>
    .line-red {
      stroke: red;
      stroke-width: 2;
      fill: none;
    }
    .line-blue {
      stroke: blue;
      stroke-width: 2;
      fill: none;
    }
    .line-green {
      stroke: green;
      stroke-width: 2;
      fill: none;
    }
    .line-yellow {
      stroke: yellow;
      stroke-width: 2;
      fill: none;
    }
    .line-white {
      stroke: white;
      stroke-width: 2;
      fill: none;
    }
    .font-red {
      font-family: sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: red;
    }
    .font-blue {
      font-family: sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: blue;
    }
    .font-green {
      font-family: sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: green;
    }
    .font-yellow {
      font-family: sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: yellow;
    }
    .font-white {
      font-family: sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: white;
    }
    .fill-red {
      fill: red;
    }
    .fill-blue {
      fill: blue;
    }
    .fill-green {
      fill: green;
    }
    .fill-yellow {
      fill: yellow;
    }
    .fill-white {
      fill: white;
    }
  </style>
    # angle AOB
    <polyline class="line-blue" points="150,10 10,110 150,110"/> 
    <circle class="fill-blue" cx="150" cy="10" r="3"/>
    <text class="font-blue" x="160" y="10" text-anchor="middle">A</text>
    <circle class="fill-white" cx="10" cy="110" r="3"/>
    <text class="font-white" x="5" y="105" text-anchor="middle">O</text>
    <circle class="fill-blue" cx="150" cy="110" r="3"/>
    <text class="font-blue" x="160" y="110" text-anchor="middle">B</text>

    # ray yellow
    <line class="line-yellow" x1="10" y1="110" x2="135" y2="60"/>
    <circle class="fill-green" cx="110" cy="70" r="3"/>
    <text class="font-green" x="145" y="55" text-anchor="middle">C</text>
    # ray red
    <line class="line-red" x1="10" y1="110" x2="50" y2="10"/>
    <circle class="fill-red" cx="44" cy="25" r="3"/>
    <text class="font-red" x="60" y="25" text-anchor="middle">D</text>

</svg>



<svg width="400" height="200" 
    xmlns="http://www.w3.org/2000/svg" style="background: transparent;">
    <style>
    .main {
      fill: #d62728;
      stroke: #d62728;
    }
    .text {
      font-family: sans-serif;
      font-weight: 600;
      font-size: 12px;
      text-anchor: middle;
    }
    .text-red { fill: #d62728; }
    .line-main {
      stroke-width: 2;
    }
  </style>
    <line class="main line-main" x1="100" y1="150" x2="300" y2="150"/>
    <line class="main line-main" x1="100" y1="150" x2="200" y2="40"/>
    <line class="main line-main" x1="200" y1="40" x2="300" y2="150"/>
    <circle class="main" cx="100" cy="150" r="4"/>
    <text class="text text-red" x="100" y="170">A</text>
    <circle class="main" cx="300" cy="150" r="4"/>
    <text class="text text-red" x="300" y="170">B</text>
    <circle class="main" cx="200" cy="40" r="4"/>
    <text class="text text-red" x="200" y="28">C</text>
</svg>
